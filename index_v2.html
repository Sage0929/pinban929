<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>拼版台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style id="page-style"></style>
<style>
/* Layout: three-column workbench — settings | cutting mat with sheets | images & print guide */
:root{
  --bg:#e9eeeb; --panel:#f8faf9; --field:#ffffff; --line:#d3dcd7; --fg:#17201c; --muted:#5a6962;
  --accent:#00739e; --accent-ink:#ffffff; --accent-soft:#e0f1f7;
  --mat:#2e5c4d; --mat-line:rgba(255,255,255,.07); --mat-line2:rgba(255,255,255,.15); --mat-ink:#cfe3da;
  --sel:#00a3d9; --good:#1d7f47; --warn:#a85208; --bad:#c22f2f;
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --panel:#161d1a; --field:#0f1513; --line:#2a3530; --fg:#e3ebe7; --muted:#93a39b;
  --accent:#43b8e0; --accent-ink:#03202b; --accent-soft:#11303b;
  --mat:#1c3a30; --mat-line:rgba(255,255,255,.05); --mat-line2:rgba(255,255,255,.11); --mat-ink:#a9c7ba;
  --good:#4fcb84; --warn:#f0a35a; --bad:#ff7070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#161d1a; --field:#0f1513; --line:#2a3530; --fg:#e3ebe7; --muted:#93a39b;
  --accent:#43b8e0; --accent-ink:#03202b; --accent-soft:#11303b;
  --mat:#1c3a30; --mat-line:rgba(255,255,255,.05); --mat-line2:rgba(255,255,255,.11); --mat-ink:#a9c7ba;
  --good:#4fcb84; --warn:#f0a35a; --bad:#ff7070; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.num,input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:700;letter-spacing:.04em}
.brand small{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.summary{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:12px}
.summary b{color:var(--fg);font-weight:500}

.app{flex:1;min-height:0;display:grid;grid-template-columns:288px minmax(0,1fr) 300px;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-width:0}
.sec{padding:14px 14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec h2{margin:0;font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h2 .r{margin-left:auto;letter-spacing:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>label{color:var(--muted);min-width:52px}
.grow{flex:1;min-width:0}
select,input[type=number],input[type=text]{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
select{width:100%}
input[type=number]{width:100%}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field span{font-size:11px;color:var(--muted)}
.unit{position:relative}
.unit input{padding-right:30px}
.unit::after{content:"mm";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-family:var(--mono);pointer-events:none}

.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--field)}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

.btn{border:1px solid var(--line);background:var(--field);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:9px 12px;width:100%;font-size:14px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* margin cross */
.mx{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;align-items:center}
.mx .t{grid-column:2;grid-row:1}.mx .l{grid-column:1;grid-row:2}.mx .r{grid-column:3;grid-row:2}.mx .b{grid-column:2;grid-row:3}
.mx .pv{grid-column:2;grid-row:2;aspect-ratio:210/297;max-height:56px;margin:auto;background:#fff;border:1px solid var(--line);position:relative;width:40px}
.mx .pv i{position:absolute;border:1px dashed var(--accent)}
.check{display:flex;gap:7px;align-items:center;cursor:pointer;user-select:none}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}

.modes{display:grid;gap:6px}
.mode{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;background:var(--field);text-align:left}
.mode input{grid-row:span 2;margin:3px 0 0;accent-color:var(--accent)}
.mode b{font-weight:500}
.mode small{color:var(--muted);grid-column:2}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.subopts{display:flex;flex-direction:column;gap:7px;padding-left:2px}

.note{font-size:12px;color:var(--muted);background:var(--bg);border-radius:7px;padding:8px 10px}
.note.warn{color:var(--warn)}

/* stage */
.stagebox{display:flex;flex-direction:column;min-width:0;min-height:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.bar{display:flex;gap:6px;align-items:center;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .sp{flex:1}
.bar .zl{font-family:var(--mono);font-size:12px;min-width:44px;text-align:center}
.stage{flex:1;overflow:auto;position:relative;background-color:var(--mat);
  background-image:linear-gradient(var(--mat-line2) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line2) 1px,transparent 1px),
  linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;padding:28px 40px 40px;display:flex;flex-direction:column;align-items:center;gap:30px}
.sheetwrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sheethead{display:flex;gap:10px;align-items:center;color:var(--mat-ink);font-size:12px;font-family:var(--mono);width:100%}
.sheethead .sp{flex:1}
.sheethead button{background:transparent;border:1px solid var(--mat-line2);color:var(--mat-ink);border-radius:6px;padding:1px 8px;cursor:pointer;font-family:var(--font);font-size:12px}
.sheethead button.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.sheet{position:relative;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25);flex:none}
.printable{position:absolute;border:1px dashed rgba(0,115,158,.55);pointer-events:none}
.reg{position:absolute;width:16px;height:16px;pointer-events:none;color:var(--mat-ink);opacity:.8}
.reg svg{display:block}
.deco{z-index:4}
.cuts{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.item{position:absolute;overflow:hidden;cursor:grab;touch-action:none;outline:1px solid rgba(0,0,0,.08)}
.item img{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.item.out{outline:2px dashed var(--bad);outline-offset:-1px}
.item.sel{outline:2px solid var(--sel);outline-offset:0;overflow:visible;z-index:2}
.item.sel>.clip{overflow:hidden}
.item.cell{outline:none;background:#fff;cursor:grab}
.item.cell.sel{outline:2px solid var(--sel)}
.item.cell .handle{display:none!important}
.tplin{position:absolute;transform-origin:center}
.tplimg{position:absolute;overflow:hidden}
.tplin svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tplimg .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#98a8a1;font-size:11px;line-height:1.3;pointer-events:none}
.psheet .item.cell{background:transparent}
.item .handle{display:none;position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#fff;border:2px solid var(--sel);border-radius:3px;cursor:nwse-resize;z-index:3}
.item.sel .handle{display:block}
.item .dim{display:none;position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:rgba(10,20,16,.78);color:#fff;font:500 11px var(--mono);padding:1px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:3}
.item.sel .dim{display:block}
.drop{position:absolute;inset:0;border:3px dashed var(--mat-ink);background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;pointer-events:none;z-index:20}
.oob{position:absolute;left:0;right:0;top:0;background:var(--bad);color:#fff;font-size:12px;padding:3px 8px;display:flex;gap:8px;align-items:center;z-index:4}
.oob button{margin-left:auto;background:#fff;color:var(--bad);border:0;border-radius:4px;padding:0 8px;cursor:pointer}

/* image list */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.thumb{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--bg);cursor:pointer;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pg{position:absolute;left:3px;top:3px;background:rgba(10,20,16,.7);color:#fff;font:500 10px var(--mono);border-radius:3px;padding:0 4px}
.thumb.sel{outline:2px solid var(--sel);outline-offset:1px}
.empty{color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center}
.insp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insp .full{grid-column:1/-1}
.pill{display:inline-block;font:500 11px var(--mono);padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.iname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* guide */
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tips li{padding-left:2px}
.tips li.w{color:var(--warn)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--accent);font-weight:500}
.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;font-size:12px;width:100%;min-width:420px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:50;font-size:13px;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--panel);border-radius:12px;max-width:900px;width:100%;max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.modal .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.modal figure{margin:0;display:flex;flex-direction:column;gap:6px}
.modal figure img{border:1px solid var(--line);background:#fff}

#print-root{display:none}
@media print{
  html,body{height:auto;background:#fff}
  .shell,.toast,.modal{display:none!important}
  #print-root{display:block}
  .psheet{position:relative;overflow:hidden;background:#fff;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .psheet:last-child{break-after:auto;page-break-after:auto}
  .psheet .item{outline:0}
}
@media (max-width:980px){
  html,body{height:auto}
  .app{grid-template-columns:1fr}
  .stagebox{height:72vh;order:-1}
  .panel{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">拼版台<small>按纸张尺寸排图 · 一键铺满可打印区域</small></div>
    <div class="summary" id="summary"></div>
  </header>
  <main class="app">
    <aside class="panel" id="left">
      <section class="sec">
        <h2>纸张</h2>
        <select id="paper" aria-label="纸张尺寸"></select>
        <div class="row" id="customRow" hidden>
          <div class="field grow"><span>宽</span><div class="unit"><input id="cw" type="number" min="20" max="1200" step="0.5"></div></div>
          <div class="field grow"><span>高</span><div class="unit"><input id="ch" type="number" min="20" max="1200" step="0.5"></div></div>
        </div>
        <div class="seg" role="group" aria-label="方向">
          <button id="oP" type="button">竖向</button><button id="oL" type="button">横向</button>
        </div>
      </section>

      <section class="sec">
        <h2>打孔 / 折页<span class="r num" id="holeInfo"></span></h2>
        <select id="holes" aria-label="打孔预设"></select>
        <div class="subopts" id="holeOpts">
          <div class="row"><label>孔在</label><div class="seg grow" role="group"><button id="hsL" type="button">左边</button><button id="hsR" type="button">右边（背面）</button></div></div>
          <div class="row">
            <div class="field grow"><span>孔径</span><div class="unit"><input id="hd" type="number" min="2" max="12" step="0.5"></div></div>
            <div class="field grow"><span>孔心距纸边</span><div class="unit"><input id="ho" type="number" min="3" max="20" step="0.5"></div></div>
          </div>
          <label class="check"><input type="checkbox" id="havoid">排版时避开孔区</label>
          <label class="check"><input type="checkbox" id="hprint">打印孔位圈（手动打孔对位用）</label>
        </div>
        <label class="check" id="foldRow"><input type="checkbox" id="fprint">打印折线（虚线）</label>
      </section>

      <section class="sec">
        <h2>活页拼版<span class="r" style="letter-spacing:0">把小活页排到大纸上</span></h2>
        <div class="field"><span>成品页尺寸</span><select id="tplSel"></select></div>
        <div class="row"><label>孔在</label><div class="seg grow" role="group"><button id="tL" type="button">左边</button><button id="tR" type="button">右边（背面）</button></div></div>
        <div class="row"><label>数量</label><div class="grow"><input id="tplN" type="number" min="0" step="1" placeholder="0 = 铺满一张"></div></div>
        <label class="check"><input type="checkbox" id="tplAvoid">图片避开孔区</label>
        <label class="check"><input type="checkbox" id="tplFrame">打印裁切框</label>
        <label class="check"><input type="checkbox" id="tplHoles">打印孔位圈</label>
        <button class="btn primary big" id="tplGo" type="button">排到纸上</button>
        <div class="row"><button class="btn grow" id="tplFillImgs" type="button">把图片依次放进空白页</button></div>
        <div class="note" id="tplInfo"></div>
      </section>

      <section class="sec">
        <h2>边距与间距<label class="check r"><input type="checkbox" id="linked">四边相同</label></h2>
        <div class="mx">
          <div class="field t"><span>上</span><div class="unit"><input id="mt" type="number" min="0" step="0.5"></div></div>
          <div class="field l"><span>左</span><div class="unit"><input id="ml" type="number" min="0" step="0.5"></div></div>
          <div class="pv" id="mpv"><i></i></div>
          <div class="field r"><span>右</span><div class="unit"><input id="mr" type="number" min="0" step="0.5"></div></div>
          <div class="field b"><span>下</span><div class="unit"><input id="mb" type="number" min="0" step="0.5"></div></div>
        </div>
        <div class="chips" aria-label="边距快捷值">
          <button class="chip" data-m="0">0</button><button class="chip" data-m="3">3</button><button class="chip" data-m="5">5</button><button class="chip" data-m="10">10</button><button class="chip" data-m="15">15</button>
        </div>
        <div class="field"><span>图片之间的间距</span><div class="unit"><input id="gap" type="number" min="0" step="0.5"></div></div>
      </section>

      <section class="sec">
        <h2>自动排版</h2>
        <div class="modes">
          <label class="mode"><input type="radio" name="mode" value="max"><b>最大化填满</b><small>每页的图片同比例放大到最大，铺满可打印区域</small></label>
          <label class="mode"><input type="radio" name="mode" value="flow"><b>紧密排列</b><small>保持现在的尺寸，挤紧排放，放不下自动换页</small></label>
        </div>
        <div class="subopts">
          <div class="row" id="sizingRow"><label>大小</label>
            <div class="seg grow" role="group"><button id="szU" type="button">统一大小</button><button id="szR" type="button">保持相对大小</button></div>
          </div>
          <div class="row" id="scopeRow"><label>范围</label>
            <div class="seg grow" role="group"><button id="scE" type="button">每页各自</button><button id="scA" type="button">合并到一页</button></div>
          </div>
          <label class="check"><input type="checkbox" id="rotate">允许旋转 90° 以塞下更多</label>
          <label class="check"><input type="checkbox" id="center">整组居中</label>
        </div>
        <button class="btn primary big" id="auto" type="button">一键排版</button>
      </section>

      <section class="sec">
        <h2>输出</h2>
        <div class="field"><span>打印用纸类型</span><select id="media"></select></div>
        <div class="row">
          <label class="check grow"><input type="checkbox" id="cut">加裁切线</label>
          <select id="dpi" style="width:auto" aria-label="导出分辨率"><option value="300">300 DPI</option><option value="200">200 DPI</option><option value="600">600 DPI</option></select>
        </div>
        <button class="btn primary big" id="print" type="button">打印</button>
        <div class="row"><button class="btn grow" id="pdf" type="button">导出 PDF</button><button class="btn grow" id="png" type="button">导出图片</button></div>
        <div class="note" id="embedNote" hidden>当前在预览框里运行，浏览器会拦截打印和下载。把这个页面部署到你自己的网址后即可正常使用；在这里可以先用「导出图片」，右键 / 长按保存。</div>
      </section>
    </aside>

    <section class="stagebox">
      <div class="bar">
        <button class="btn" id="add" type="button">＋ 添加图片</button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <button class="btn" id="addPage" type="button">＋ 新页</button>
        <span class="sp"></span>
        <button class="btn" id="zOut" type="button" aria-label="缩小视图">−</button>
        <span class="zl" id="zLabel">100%</span>
        <button class="btn" id="zIn" type="button" aria-label="放大视图">＋</button>
        <button class="btn" id="zFit" type="button">适应</button>
      </div>
      <div class="stage" id="stage" tabindex="0" aria-label="排版区，可拖入图片"></div>
    </section>

    <aside class="panel" id="right">
      <section class="sec">
        <h2>图片 <span id="imgCount" class="num"></span><span class="r row" style="gap:6px"><button class="btn danger" id="clearAll" type="button">清空</button></span></h2>

function area(){const {W,H}=WH();let l=S.m.l,r=S.m.r;if(S.holes!=='none'&&S.holeAvoid){const z=holeZone();if(S.holeSide==='left')l=Math.max(l,z);else r=Math.max(r,z);}return {x:l,y:S.m.t,w:W-l-r,h:H-S.m.t-S.m.b};}

function holeCenters(){const hp=HOLES[S.holes];if(!hp||!hp.g)return [];const {W,H}=WH();const span=hp.g.reduce((a,b)=>a+b,0);let y=(H-span)/2;const x=S.holeSide==='left'?S.holeOff:W-S.holeOff;const out=[[x,y]];for(const d of hp.g){y+=d;out.push([x,y]);}return out;}
function cellRegion(it){const t=it.tpl;if(!it.avoid||!HOLES[t.holes]||!HOLES[t.holes].g)return {x:0,y:0,w:t.w,h:t.h};const z=t.off+t.d/2+2;return t.side==='left'?{x:z,y:0,w:t.w-z,h:t.h}:{x:0,y:0,w:t.w-z,h:t.h};}
function cellHoles(t){const hp=HOLES[t.holes];if(!hp||!hp.g)return [];const span=hp.g.reduce((a,b)=>a+b,0);let y=(t.h-span)/2;const x=t.side==='left'?t.off:t.w-t.off;const out=[[x,y]];for(const d of hp.g){y+=d;out.push([x,y]);}return out;}
function cellSVG(it,screen){

}

function tplLayout(tw,th){
  const A=area(),g=S.gap;if(A.w<=0||A.h<=0)return [];
  const grid=(w,h,rot)=>{const c=Math.floor((A.w+g+EPS)/(w+g)),r=Math.floor((A.h+g+EPS)/(h+g)),out=[];for(let i=0;i<r;i++)for(let j=0;j<c;j++)out.push({x:j*(w+g),y:i*(h+g),w,h,rot});return out;};
  let best=grid(tw,th,false);const b2=grid(th,tw,true);if(b2.length>best.length)best=b2;
  const N=Math.min(200,Math.floor(A.w*A.h/(tw*th)));
  if(N>best.length){const rects=Array.from({length:N},(_,i)=>({key:'t'+i,w:tw,h:th}));for(const h of ['bl','bssf']){const r=packRects(rects,A.w,A.h,g,true,h);if(r.placed.length>best.length)best=r.placed.map(p=>({x:p.x,y:p.y,w:p.w,h:p.h,rot:p.rot}));}}
  return best;
}

  let n=0;for(const c of cells){const im=imgs.shift();if(!im)break;assignImg(c,im);S.items=S.items.filter(i=>i!==im);n++;}
  trimPages();return n;
}
function tplPlace(t,n){
  const cells=tplLayout(t.w,t.h);
  if(!cells.length){toast('这个成品尺寸比可打印区域还大，换大一点的纸或减小边距');return null;}
  S.items=S.items.filter(i=>!i.sample);
  let want=n>0?n:cells.length,made=0,page=firstEmptyPage();
  while(want>0){
    const use=cells.slice(0,Math.min(want,cells.length));
    const placed=use.map(c=>{const it={id:uid(),kind:'cell',name:t.n,tpl:Object.assign({},t),page,x:0,y:0,w:t.w,h:t.h,rot:0,imgRot:0,avoid:S.tplAvoid,fit:'cover'};S.items.push(it);return {key:it.id,x:c.x,y:c.y,w:c.w,h:c.h,rot:c.rot};});
    applyPlaced(placed,page);made+=use.length;want-=use.length;if(want>0)page=firstEmptyPage();
  }
  const filled=fillCells();
  return {made,filled,per:cells.length};
}

function util(p){const A=area();if(A.w<=0||A.h<=0)return 0;let s=0;for(const it of onPage(p)){const w=Math.max(0,Math.min(it.x+it.w,A.x+A.w)-Math.max(it.x,A.x));const h=Math.max(0,Math.min(it.y+it.h,A.y+A.h)-Math.max(it.y,A.y));s+=w*h;}return Math.min(100,s/(A.w*A.h)*100);}
function dpiOf(it){if(it.kind==='cell'){if(!it.img)return null;const r=cellRegion(it);let nw=it.nw,nh=it.nh;if(it.imgRot)[nw,nh]=[nh,nw];return Math.round(Math.min(nw/(r.w/25.4),nh/(r.h/25.4)));}

let toastT;function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}

/* ---------- packing (MaxRects) ---------- */
function makeBin(W,H){
  let free=[{x:0,y:0,w:W,h:H}];
  const inter=(a,b)=>!(b.x>=a.x+a.w-EPS||b.x+b.w<=a.x+EPS||b.y>=a.y+a.h-EPS||b.y+b.h<=a.y+EPS);
  const cont=(a,b)=>b.x>=a.x-EPS&&b.y>=a.y-EPS&&b.x+b.w<=a.x+a.w+EPS&&b.y+b.h<=a.y+a.h+EPS;
  function occupy(r){
    const out=[];
    for(const f of free){
      if(!inter(f,r)){out.push(f);continue;}
      if(r.x>f.x+EPS)out.push({x:f.x,y:f.y,w:r.x-f.x,h:f.h});
      if(r.x+r.w<f.x+f.w-EPS)out.push({x:r.x+r.w,y:f.y,w:f.x+f.w-(r.x+r.w),h:f.h});
      if(r.y>f.y+EPS)out.push({x:f.x,y:f.y,w:f.w,h:r.y-f.y});
      if(r.y+r.h<f.y+f.h-EPS)out.push({x:f.x,y:r.y+r.h,w:f.w,h:f.y+f.h-(r.y+r.h)});
    }
    free=out.filter((a,i)=>!out.some((b,j)=>j!==i&&cont(b,a)&&(!cont(a,b)||j<i)));
  }
  function find(w,h,allowRot,heur){
    let best=null;
    for(const f of free)for(const rot of allowRot?[false,true]:[false]){
      const rw=rot?h:w,rh=rot?w:h;
      if(rw<=f.w+EPS&&rh<=f.h+EPS){
        let s1,s2;
        if(heur==='bl'){s1=f.y+rh;s2=f.x;}else{const dw=f.w-rw,dh=f.h-rh;s1=Math.min(dw,dh);s2=Math.max(dw,dh);}
        if(!best||s1<best.s1-EPS||(Math.abs(s1-best.s1)<=EPS&&s2<best.s2-EPS))best={x:f.x,y:f.y,w:rw,h:rh,rot,s1,s2};
      }
    }
    return best;
  }
  return {occupy,find};
}
function packRects(rects,AW,AH,g,allowRot,heur){
  const bin=makeBin(AW+g,AH+g),placed=[],rest=[];
  for(const r of rects){
    const p=bin.find(r.w+g,r.h+g,allowRot,heur);
    if(!p){rest.push(r);continue;}
    bin.occupy({x:p.x,y:p.y,w:p.w,h:p.h});
    placed.push({key:r.key,x:p.x,y:p.y,w:p.w-g,h:p.h-g,rot:p.rot});
  }
  return {placed,rest};
}
const ORDERS=[(a,b)=>b.w*b.h-a.w*a.h,(a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h),(a,b)=>b.h-a.h,(a,b)=>b.w-a.w];
function packAll(rects,AW,AH,g,allowRot){
  for(const o of ORDERS)for(const h of ['bssf','bl']){const r=packRects([...rects].sort(o),AW,AH,g,allowRot,h);if(!r.rest.length)return r.placed;}
  return null;
}
function applyPlaced(placed,page){
  const A=area();
  let dx=0,dy=0;
  if(S.center&&placed.length){
    const x0=Math.min(...placed.map(p=>p.x)),y0=Math.min(...placed.map(p=>p.y));
    const x1=Math.max(...placed.map(p=>p.x+p.w)),y1=Math.max(...placed.map(p=>p.y+p.h));
    dx=(A.w-(x1-x0))/2-x0;dy=(A.h-(y1-y0))/2-y0;
  }
  for(const p of placed){
    const it=byId(p.key);if(!it)continue;
    if(p.rot)it.rot=it.rot?0:90;
    it.w=p.w;it.h=p.h;it.x=A.x+p.x+dx;it.y=A.y+p.y+dy;it.page=page;
  }
}
function maximizeList(list,page){
  const A=area(),g=S.gap;
  if(!list.length)return true;
  const base=list.map(it=>{const a=it.w/it.h;return S.sizing==='uniform'?{key:it.id,w:Math.sqrt(a),h:1/Math.sqrt(a)}:{key:it.id,w:it.w,h:it.h};});
  let hi=Infinity,sum=0;
  for(const b of base){let f=Math.min(A.w/b.w,A.h/b.h);if(S.rotate)f=Math.max(f,Math.min(A.w/b.h,A.h/b.w));hi=Math.min(hi,f);sum+=b.w*b.h;}
  hi=Math.min(hi,Math.sqrt(A.w*A.h/sum));
  const at=s=>packAll(base.map(b=>({key:b.key,w:b.w*s,h:b.h*s})),A.w,A.h,g,S.rotate);
  let lo=0,best=at(hi);
  if(best)lo=hi;else for(let i=0;i<30;i++){const mid=(lo+hi)/2,r=at(mid);if(r){lo=mid;best=r;}else hi=mid;}
  if(!best)return false;
  applyPlaced(best,page);return true;
}
function flowAll(){
  const A=area(),g=S.gap;let shrunk=0;
  for(const it of S.items){
    if(it.kind==='cell')continue;
    const fits=(it.w<=A.w+EPS&&it.h<=A.h+EPS)||(S.rotate&&it.h<=A.w+EPS&&it.w<=A.h+EPS);
    if(!fits){let f=Math.min(A.w/it.w,A.h/it.h);if(S.rotate)f=Math.max(f,Math.min(A.w/it.h,A.h/it.w));it.w*=f;it.h*=f;shrunk++;}
  }
  let rest=S.items.map(it=>({key:it.id,w:it.w,h:it.h})).sort(ORDERS[0]),page=0;
  while(rest.length){
    let best=null;
    for(const h of ['bssf','bl']){const r=packRects(rest,A.w,A.h,g,S.rotate,h);if(!best||r.placed.length>best.placed.length)best=r;}
    if(!best.placed.length)break;
    applyPlaced(best.placed,page);rest=best.rest;page++;
  }
  S.pages=Math.max(1,page);
  return shrunk;
}
function runAuto(){
  const A=area();
  if(!S.items.length){toast('先添加图片');return;}
  if(A.w<=1||A.h<=1){toast('边距太大，没有可打印区域了');return;}
  const hasCells=S.items.some(i=>i.kind==='cell');
  if(S.mode==='flow'||hasCells){const n=flowAll();if(hasCells&&S.mode!=='flow'){toast(`有活页页面，按原尺寸紧密排列，共 ${S.pages} 页`);renderAll();return;}toast(n?`已排好，共 ${S.pages} 页（${n} 张比纸大，已缩小到能放下）`:`已紧密排列，共 ${S.pages} 页`);}
  else{
    if(S.scope==='all'){S.items.forEach(i=>i.page=0);S.pages=1;}
    let ok=true;
    for(let p=0;p<S.pages;p++)ok=maximizeList(onPage(p),p)&&ok;
    trimPages();
    toast(ok?'已放大到最大并铺满':'有的页放不下：图片太多或间距太大，试试减小间距');
  }
  renderAll();
}
function trimPages(){let last=0;S.items.forEach(i=>last=Math.max(last,i.page));S.pages=Math.max(1,Math.min(S.pages,last+1));}

/* new images go into free space */
function placeNew(list){
  const A=area(),g=S.gap;
  for(const it of list){
    const a=it.nw/it.nh;let w=A.w*0.45,h=w/a;if(h>A.h*0.45){h=A.h*0.45;w=h*a;}it.w=Math.max(5,w);it.h=it.w/a;
  }
  let p=S.pages-1;
  const binFor=pg=>{const bin=makeBin(A.w+g,A.h+g);for(const o of onPage(pg)){if(list.includes(o))continue;bin.occupy({x:o.x-A.x,y:o.y-A.y,w:o.w+g,h:o.h+g});}return bin;};
  let bin=binFor(p);
  for(const it of list){
    let spot=bin.find(it.w+g,it.h+g,false,'bl');
    if(!spot){p=S.pages;S.pages++;bin=binFor(p);spot=bin.find(it.w+g,it.h+g,false,'bl');}
    if(!spot){spot={x:0,y:0,w:it.w+g,h:it.h+g};}
    bin.occupy({x:spot.x,y:spot.y,w:it.w+g,h:it.h+g});
    it.x=A.x+spot.x;it.y=A.y+spot.y;it.page=p;
  }
}

/* fill a page with copies of one image */
function fillCopies(it){
  const A=area(),g=S.gap,bw=it.w,bh=it.h,brot=it.rot;
  const grid=(w,h,r)=>({c:Math.floor((A.w+g+EPS)/(w+g)),r:Math.floor((A.h+g+EPS)/(h+g)),w,h,rot:r});
  let gd=grid(bw,bh,false);if(S.rotate){const b=grid(bh,bw,true);if(b.c*b.r>gd.c*gd.r)gd=b;}
  let cells=[];
  for(let r=0;r<gd.r;r++)for(let c=0;c<gd.c;c++)cells.push({x:c*(gd.w+g),y:r*(gd.h+g),w:gd.w,h:gd.h,rot:gd.rot});
  if(S.rotate){
    const N=Math.min(400,Math.floor(A.w*A.h/(bw*bh)));
    const rects=Array.from({length:N},(_,i)=>({key:'c'+i,w:bw,h:bh}));
    for(const h of ['bl','bssf']){const r=packRects(rects,A.w,A.h,g,true,h);if(r.placed.length>cells.length)cells=r.placed.map(p=>({x:p.x,y:p.y,w:p.w,h:p.h,rot:p.rot}));}
  }
  if(!cells.length){toast('这张图比可打印区域还大，先缩小一点');return;}
  let page=it.page;
  if(onPage(page).length>1){page=S.pages;S.pages++;}
  const placed=cells.map((c,i)=>{
    const n=i===0?it:cloneItem(it);
    if(i>0)S.items.push(n);
    n.rot=c.rot?(brot?0:90):brot;
    return {key:n.id,x:c.x,y:c.y,w:c.w,h:c.h,rot:false};
  });
  applyPlaced(placed,page);
  toast(`第 ${page+1} 页铺了 ${cells.length} 张`);
  renderAll();
}

let K=1;

function styleItem(el,it,k){

  else{img.style.width=u(it.w);img.style.height=u(it.h);img.style.left='0';img.style.top='0';img.style.transform='none';}
  img.style.objectFit=it.fit==='cover'?'cover':'contain';

function makeItem(it,k,forPrint){

function cutSegs(its){
  const o=1,L=3,out=[];
  for(const it of its){const x1=it.x,y1=it.y,x2=it.x+it.w,y2=it.y+it.h;
    out.push([x1-o-L,y1,x1-o,y1],[x1,y1-o-L,x1,y1-o],[x2+o,y1,x2+o+L,y1],[x2,y1-o-L,x2,y1-o],
             [x1-o-L,y2,x1-o,y2],[x1,y2+o,x1,y2+o+L],[x2+o,y2,x2+o+L,y2],[x2,y2+o,x2,y2+o+L]);}

}
function cutSVG(its){

}
const REG='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><circle cx="8" cy="8" r="4.5"/><path d="M8 0v16M0 8h16"/></svg>';
function calcK(){
  const {W,H}=WH();

}
function render(){

      +(S.cut?cutSVG(its):'')

    wrap.appendChild(sh);stage.appendChild(wrap);

  else if(e.key==='Delete'||e.key==='Backspace'){S.items=S.items.filter(i=>i!==it);S.sel=null;}
  else if((e.key==='+'||e.key==='=')&&it.kind!=='cell'){const c=[it.x+it.w/2,it.y+it.h/2];it.w*=1.05;it.h*=1.05;it.x=c[0]-it.w/2;it.y=c[1]-it.h/2;}
  else if(e.key==='-'&&it.kind!=='cell'){const c=[it.x+it.w/2,it.y+it.h/2];it.w/=1.05;it.h/=1.05;it.x=c[0]-it.w/2;it.y=c[1]-it.h/2;}
  else hit=false;
  if(hit){e.preventDefault();renderAll();}
});

/* ---------- adding images ---------- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function addFiles(files){
  const list=[];
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    const src=URL.createObjectURL(f);
    try{const im=await loadImg(src);list.push({id:uid(),name:f.name||'粘贴的图片',src,img:im,nw:im.naturalWidth,nh:im.naturalHeight,page:0,x:0,y:0,w:10,h:10,rot:0,fit:'contain',lock:true});}
    catch(err){toast(`${f.name} 打不开，换成 JPG 或 PNG 试试`);}
  }
  if(!list.length)return;
  const hadSamples=S.items.length&&S.items.every(i=>i.sample);
  if(hadSamples){S.items=[];S.pages=1;}
  const empties=S.items.filter(i=>i.kind==='cell'&&!i.src).sort(ordPos),rest=[];let intoCells=0;
  for(const im of list){const c=empties.shift();if(c){assignImg(c,im);intoCells++;S.sel=c.id;}else rest.push(im);}
  if(rest.length){S.items.push(...rest);placeNew(rest);S.sel=rest[rest.length-1].id;}
  if(intoCells){renderAll();toast(`${intoCells} 张放进了空白活页${rest.length?`，另外 ${rest.length} 张放在纸上`:''}`);return;}
  renderAll();
  toast(hadSamples?`已移除示例，添加了 ${list.length} 张。点「一键排版」铺满`:`添加了 ${list.length} 张`);
}
let dragDepth=0,dropEl=null;
stage.addEventListener('dragenter',e=>{if(!e.dataTransfer.types.includes('Files'))return;e.preventDefault();dragDepth++;if(!dropEl){dropEl=document.createElement('div');dropEl.className='drop';dropEl.textContent='松开即可添加图片';stage.parentElement.style.position='relative';stage.parentElement.appendChild(dropEl);}});
stage.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault();});
stage.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth&&dropEl){dropEl.remove();dropEl=null;}});
stage.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;if(dropEl){dropEl.remove();dropEl=null;}addFiles([...e.dataTransfer.files]);});
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();addFiles(fs);}});

/* ---------- output ---------- */
function buildPrint(){
  const {W,H}=WH();
  $('#page-style').textContent=`@page{size:${W}mm ${H}mm;margin:0}`;
  const root=$('#print-root');root.innerHTML='';
  for(let p=0;p<S.pages;p++){
    const sh=document.createElement('div');sh.className='psheet';sh.style.width=W+'mm';sh.style.height=H+'mm';
    const its=onPage(p);if(S.cut)sh.innerHTML=cutSVG(its);
    for(const it of its)sh.appendChild(makeItem(it,null,true));
    sh.insertAdjacentHTML('beforeend',decoSVG(false));
    root.appendChild(sh);
  }
}
window.addEventListener('beforeprint',buildPrint);
$('#print').onclick=()=>{if(!S.items.length){toast('先添加图片');return;}buildPrint();try{window.print();}catch(e){}};
function drawCell(ctx,it,k){
  const t=it.tpl;ctx.save();ctx.translate((it.x+it.w/2)*k,(it.y+it.h/2)*k);if(it.rot)ctx.rotate(Math.PI/2);ctx.translate(-t.w*k/2,-t.h*k/2);
  if(it.img){const r=cellRegion(it);ctx.save();ctx.beginPath();ctx.rect(r.x*k,r.y*k,r.w*k,r.h*k);ctx.clip();ctx.translate((r.x+r.w/2)*k,(r.y+r.h/2)*k);
    let dw=r.w*k,dh=r.h*k;if(it.imgRot){ctx.rotate(Math.PI/2);[dw,dh]=[dh,dw];}
    const img=it.img,nw=img.naturalWidth,nh=img.naturalHeight,ia=nw/nh,ba=dw/dh;let sx=0,sy=0,sw=nw,sh=nh;if(ia>ba){sw=nh*ba;sx=(nw-sw)/2;}else{sh=nw/ba;sy=(nh-sh)/2;}
    ctx.drawImage(img,sx,sy,sw,sh,-dw/2,-dh/2,dw,dh);ctx.restore();}
  const lw=Math.max(1,0.2*k);
  if(S.tplFrame){ctx.strokeStyle='#aaa';ctx.lineWidth=lw;ctx.strokeRect(0,0,t.w*k,t.h*k);}
  if(t.folds&&S.foldPrint){ctx.save();ctx.strokeStyle='#999';ctx.lineWidth=lw;ctx.setLineDash([2*k,1.5*k]);for(const f of t.folds){ctx.beginPath();ctx.moveTo(f*k,0);ctx.lineTo(f*k,t.h*k);ctx.stroke();}ctx.restore();}
  if(S.tplHoles){ctx.strokeStyle='#888';ctx.lineWidth=lw;for(const c of cellHoles(t)){ctx.beginPath();ctx.arc(c[0]*k,c[1]*k,t.d/2*k,0,Math.PI*2);ctx.stroke();}}
  ctx.restore();
}
function drawItem(ctx,it,k){
  if(it.kind==='cell'){drawCell(ctx,it,k);return;}
  const img=it.img;if(!img)return;
  const bw=it.w*k,bh=it.h*k;
  ctx.save();ctx.translate((it.x+it.w/2)*k,(it.y+it.h/2)*k);
  ctx.beginPath();ctx.rect(-bw/2,-bh/2,bw,bh);ctx.clip();
  let dw=bw,dh=bh;if(it.rot){ctx.rotate(Math.PI/2);dw=bh;dh=bw;}
  const nw=img.naturalWidth,nh=img.naturalHeight,ia=nw/nh,ba=dw/dh;
  if(it.fit==='cover'){let sx=0,sy=0,sw=nw,sh=nh;if(ia>ba){sw=nh*ba;sx=(nw-sw)/2;}else{sh=nw/ba;sy=(nh-sh)/2;}ctx.drawImage(img,sx,sy,sw,sh,-dw/2,-dh/2,dw,dh);}
  else{const s=Math.min(dw/nw,dh/nh);ctx.drawImage(img,-nw*s/2,-nh*s/2,nw*s,nh*s);}
  ctx.restore();
}
function pageCanvas(p,dpi){
  const {W,H}=WH(),k=dpi/25.4,c=document.createElement('canvas');
  c.width=Math.round(W*k);c.height=Math.round(H*k);
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.imageSmoothingQuality='high';
  const its=onPage(p);
  if(S.cut){ctx.strokeStyle='#000';ctx.lineWidth=Math.max(1,0.2*k);for(const s of cutSegs(its)){ctx.beginPath();ctx.moveTo(s[0]*k,s[1]*k);ctx.lineTo(s[2]*k,s[3]*k);ctx.stroke();}}
  for(const it of its)drawItem(ctx,it,k);
  if(S.foldPrint){ctx.save();ctx.strokeStyle='#999';ctx.lineWidth=Math.max(1,0.2*k);ctx.setLineDash([2*k,1.5*k]);for(const l of foldLines()){ctx.beginPath();ctx.moveTo(l[0]*k,l[1]*k);ctx.lineTo(l[2]*k,l[3]*k);ctx.stroke();}ctx.restore();}
  if(S.holePrint){ctx.strokeStyle='#888';ctx.lineWidth=Math.max(1,0.2*k);for(const c of holeCenters()){ctx.beginPath();ctx.arc(c[0]*k,c[1]*k,S.holeD/2*k,0,Math.PI*2);ctx.stroke();}}
  return c;
}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}
$('#pdf').onclick=async()=>{
  if(!S.items.length){toast('先添加图片');return;}
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('PDF 组件没加载成功，刷新页面再试');return;}
  toast('正在生成 PDF…');await new Promise(r=>setTimeout(r,30));
  const {W,H}=WH(),doc=new J({orientation:W>H?'l':'p',unit:'mm',format:[W,H],compress:true});
  for(let p=0;p<S.pages;p++){if(p)doc.addPage([W,H],W>H?'l':'p');doc.addImage(pageCanvas(p,S.dpi).toDataURL('image/jpeg',0.93),'JPEG',0,0,W,H,undefined,'FAST');}
  doc.save(`拼版_${paper().id}_${S.pages}页.pdf`);
};
$('#png').onclick=async()=>{
  if(!S.items.length){toast('先添加图片');return;}
  toast('正在生成图片…');await new Promise(r=>setTimeout(r,30));
  const urls=[];
  for(let p=0;p<S.pages;p++){const c=pageCanvas(p,S.dpi);const b=await new Promise(r=>c.toBlob(r,'image/png'));urls.push({url:URL.createObjectURL(b),w:c.width,h:c.height});}
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box" role="dialog" aria-label="导出的图片"><div class="row"><b class="grow">导出的图片（${S.dpi} DPI）</b><button class="btn" data-close type="button">关闭</button></div>
  <div class="note">点「下载」保存；如果没反应，在图片上右键「图片另存为」或手机长按保存。</div>
  <div class="imgs">${urls.map((u,i)=>`<figure><img src="${u.url}" alt="第 ${i+1} 页"><div class="row"><span class="num grow">第 ${i+1} 页 · ${u.w}×${u.h}px</span><button class="btn" data-dl="${i}" type="button">下载</button></div></figure>`).join('')}</div></div>`;
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]')){m.remove();urls.forEach(u=>URL.revokeObjectURL(u.url));}const d=e.target.closest('[data-dl]');if(d)download(urls[+d.dataset.dl].url,`拼版_第${+d.dataset.dl+1}页.png`);});
  document.body.appendChild(m);
};

/* ---------- start ---------- */
try{if(window.self!==window.top)$('#embedNote').hidden=false;}catch(e){$('#embedNote').hidden=false;}
function sample(w,h,c1,c2,label){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,c1);gr.addColorStop(1,c2);x.fillStyle=gr;x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.arc(w*.72,h*.3,Math.min(w,h)*.12,0,7);x.fill();
  x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.moveTo(0,h);x.lineTo(w*.3,h*.55);x.lineTo(w*.55,h*.8);x.lineTo(w*.8,h*.5);x.lineTo(w,h*.75);x.lineTo(w,h);x.fill();
  x.fillStyle='#fff';x.font=`600 ${Math.round(Math.min(w,h)*.08)}px "Noto Sans SC",sans-serif`;x.textAlign='center';x.fillText(label,w/2,h*.55);
  return c.toDataURL('image/jpeg',0.9);
}
(async()=>{
  const defs=[[1800,1200,'#7fb7d6','#3c6e8f','示例 · 3:2'],[1000,1500,'#e3a77b','#9b5a3c','示例 · 2:3'],[1400,1400,'#9cc7a0','#4d7f55','示例 · 1:1'],[1200,1500,'#b9a6d9','#6a5a93','示例 · 4:5']];
  for(const d of defs){const src=sample(...d);const im=await loadImg(src);S.items.push({id:uid(),name:d[4],src,img:im,nw:d[0],nh:d[1],page:0,x:0,y:0,w:d[0]/d[1],h:1,rot:0,fit:'contain',lock:true,sample:true});}
  const saved={mode:S.mode,center:S.center};S.mode='max';
  maximizeList(S.items,0);Object.assign(S,saved);
  renderAll();
})();
renderAll();
let rq;new ResizeObserver(()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(render);}).observe(stage);
})();
